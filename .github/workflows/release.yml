name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload assets to (heel-v<version> or shim/v<version>)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-plz:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      heel_tag: ${{ steps.release_tags.outputs.heel_tag }}
      shim_tag: ${{ steps.release_tags.outputs.shim_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Mint a short-lived crates.io token from the GitHub OIDC identity
      # instead of a stored CARGO_REGISTRY_TOKEN (trusted publishing is
      # configured per crate on crates.io).
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - id: release
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      - name: Resolve released tags
        id: release_tags
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES_JSON: ${{ steps.release.outputs.releases }}
        run: |
          # A run releases heel, heel-shim, or both: each package's tag, or
          # nothing when that package was not released.
          tag_of() {
            jq -r --arg package "$1" '
              map(select(.package_name == $package)) as $releases
              | if ($releases | length) == 1 then $releases[0].tag
                elif ($releases | length) == 0 then ""
                else error("more than one release of " + $package) end
            ' <<<"${RELEASES_JSON}"
          }
          heel_tag="$(tag_of heel)"
          shim_tag="$(tag_of heel-shim)"
          if [[ -z "${heel_tag}" && -z "${shim_tag}" ]]; then
            echo "release-plz created releases but returned neither a heel nor a heel-shim release tag" >&2
            exit 1
          fi
          echo "heel_tag=${heel_tag}" >> "${GITHUB_OUTPUT}"
          echo "shim_tag=${shim_tag}" >> "${GITHUB_OUTPUT}"

  resolve-release:
    name: Resolve Release Tags
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: release-plz
    outputs:
      heel_tag: ${{ steps.resolve.outputs.heel_tag }}
      shim_tag: ${{ steps.resolve.outputs.shim_tag }}
    steps:
      - name: Resolve release tags for asset upload
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          AUTO_RELEASES_CREATED: ${{ needs.release-plz.outputs.releases_created }}
          AUTO_HEEL_TAG: ${{ needs.release-plz.outputs.heel_tag }}
          AUTO_SHIM_TAG: ${{ needs.release-plz.outputs.shim_tag }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ -z "${MANUAL_TAG}" ]]; then
              echo "workflow_dispatch requires the release_tag input" >&2
              exit 1
            fi
            case "${MANUAL_TAG}" in
              shim/v*)
                echo "heel_tag=" >> "${GITHUB_OUTPUT}"
                echo "shim_tag=${MANUAL_TAG}" >> "${GITHUB_OUTPUT}"
                ;;
              heel-v*)
                echo "heel_tag=${MANUAL_TAG}" >> "${GITHUB_OUTPUT}"
                echo "shim_tag=" >> "${GITHUB_OUTPUT}"
                ;;
              *)
                echo "release_tag must be heel-v<version> or shim/v<version>: ${MANUAL_TAG}" >&2
                exit 1
                ;;
            esac
            exit 0
          fi

          if [[ "${AUTO_RELEASES_CREATED}" != "true" ]]; then
            echo "heel_tag=" >> "${GITHUB_OUTPUT}"
            echo "shim_tag=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "heel_tag=${AUTO_HEEL_TAG}" >> "${GITHUB_OUTPUT}"
          echo "shim_tag=${AUTO_SHIM_TAG}" >> "${GITHUB_OUTPUT}"

  release-assets:
    name: Release Assets
    needs: resolve-release
    if: ${{ always() && needs.resolve-release.outputs.heel_tag != '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.heel_tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build heel
        run: cargo build --locked --release --bin heel --target "${{ matrix.target }}"

      - name: Prepare release asset
        id: asset
        run: |
          asset_name="heel-${{ matrix.target }}"
          binary_path="target/${{ matrix.target }}/release/heel"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            asset_name="${asset_name}.exe"
            binary_path="${binary_path}.exe"
          fi
          cp "${binary_path}" "${asset_name}"
          echo "asset_name=${asset_name}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.asset.outputs.asset_name }}

      - name: Upload asset to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.heel_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" "${{ steps.asset.outputs.asset_name }}#${{ steps.asset.outputs.asset_name }}" --clobber

  # heel's build script downloads these executables by name from the shim's
  # release, so the asset names here are part of its contract. Linux ones are
  # static musl builds, which serve the gnu and musl targets of their
  # architecture alike.
  shim-assets:
    name: Shim Assets
    needs: resolve-release
    if: ${{ always() && needs.resolve-release.outputs.shim_tag != '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.shim_tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build heel-shim
        run: cargo build --locked --release --package heel-shim --bin heel-shim --target "${{ matrix.target }}"

      - name: Prepare release asset
        id: asset
        run: |
          asset_name="heel-shim-${{ matrix.target }}"
          binary_path="target/${{ matrix.target }}/release/heel-shim"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            asset_name="${asset_name}.exe"
            binary_path="${binary_path}.exe"
          fi
          cp "${binary_path}" "${asset_name}"
          echo "asset_name=${asset_name}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.asset.outputs.asset_name }}

      - name: Upload asset to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.shim_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" "${{ steps.asset.outputs.asset_name }}#${{ steps.asset.outputs.asset_name }}" --clobber
