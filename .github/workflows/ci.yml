name: CI

permissions:
  contents: read
  checks: write
  id-token: write

on:
  # Topic branches are tested through their pull request. A push trigger on
  # every branch ran the whole workflow a second time for each commit of an
  # open pull request, so pushes run it only where no pull request does.
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
  # A push whose webhook is dropped -- during a GitHub incident, say -- leaves a
  # commit with no run and no way to ask for one. This makes CI startable by
  # hand for any ref.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release-plz bump changes workspace versions and the changelog and
  # nothing else, so it cannot change what a compiler, a test or an audit
  # observes beyond the version string, and the jobs that build or audit the
  # crate skip it. The script reads
  # the diff rather than the branch name: code pushed onto a release branch
  # runs every job. A job skipped by `if:` reports success.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.bump.outputs.only != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Every event diffs a range it names: a pull request its merge base with
      # the target, a merge group its base, a push the commits it carries, and
      # a dispatch on a branch other than `main` the branch against `main`.
      # With no range (a new branch, a dispatch on `main`) nothing is
      # skipped.
      - name: Version-only diff
        id: bump
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=$PR_BASE; head=$PR_HEAD ;;
            merge_group) base=$MERGE_BASE; head=$MERGE_HEAD ;;
            push) base=$PUSH_BEFORE; head=$SHA ;;
            workflow_dispatch)
              base=
              head=$SHA
              if [ "$REF_NAME" != main ]; then
                git fetch --no-tags origin main
                base=$(git rev-parse FETCH_HEAD)
              fi
              ;;
            *) base=; head=$SHA ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            echo "no diff range for $EVENT; running every job"
            echo "only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          only=$(python3 -I .github/scripts/version-only.py "$(git merge-base "$base" "$head")" "$head")
          echo "only=$only" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # The `lint` job runs on x86_64 Linux, where `cfg(target_os = "windows")` and
  # the aarch64 arms of the seccomp filter compile to nothing: the code hardest
  # to check by hand is the code the lint gate never sees, and it accumulated
  # dead helpers unnoticed. Each is linted on a runner of its own target: the
  # build script links the `heel-shim` executable for the target, which a
  # foreign runner has no linker for.
  cross-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Cross-target Lint (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cross-${{ matrix.target }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - run: cargo llvm-cov nextest --all-features --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5.5.4
        with:
          use_oidc: true
          fail_ci_if_error: false
  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  unused-deps:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: taiki-e/install-action@cargo-machete
      - run: cargo machete

  feature-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --each-feature --no-dev-deps
      - run: cargo hack check --feature-powerset --no-dev-deps

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test
    uses: ./.github/workflows/test.yml

  result:
    # The required check on `main`: green when every job it needs succeeded or
    # was skipped.
    name: CI result
    if: always()
    needs: [changes, lint, cross-lint, coverage, audit, unused-deps, feature-checks, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" = failure ] || [ "$result" = cancelled ]; then
              echo "::error::a needed job ended $result"
              exit 1
            fi
          done
